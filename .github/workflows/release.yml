name: release

# Builds the signed APK and publishes a GitHub release with the CHANGELOG section of that
# version, then posts it to Telegram (when its secrets are set).
#
# Run it from the Actions tab (release -> Run workflow -> version, e.g. v1.0.0-beta.1), or
# push a tag such as v1.0.0 and it runs by itself. A version with a dash (v1.0.0-beta.1)
# is published as a pre-release: the app offers it only to people already on a beta.
#
# The APK is signed with the release key in these secrets, never with a test key: Android
# installs an update only when it is signed with the same key as the app on the phone.
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0-beta.1"
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Not VERSION: MSBuild reads environment variables as properties.
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the version
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The version must look like v1.0.0 or v1.0.0-beta.1, got '$RELEASE_VERSION'."
            exit 1
          fi
          if ! grep -qx "## $RELEASE_VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $RELEASE_VERSION' section; add one first."
            exit 1
          fi
          if ! grep -qF "<ApplicationDisplayVersion>${RELEASE_VERSION#v}</ApplicationDisplayVersion>" src/FastbootStudio.Mobile/FastbootStudio.Mobile.csproj; then
            echo "::error::FastbootStudio.Mobile.csproj does not say version ${RELEASE_VERSION#v}; update ApplicationDisplayVersion (and ApplicationVersion) first."
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $RELEASE_VERSION already exists."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Load the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::The release key is not set: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Test the safety core
        run: dotnet test tests/FastbootStudio.Mobile.Core.Tests -c Release
      # The runner's newest SDK refuses net8.0-android: build with the .NET 8 SDK.
      - name: Use the .NET 8 SDK
        run: dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^8\.' | tail -1 | cut -d' ' -f1)" --roll-forward latestPatch && dotnet --version
      - run: dotnet workload install android

      - name: Build the signed APK
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          dotnet build src/FastbootStudio.Mobile/FastbootStudio.Mobile.csproj -c Release
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=true
          -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.jks"
          -p:AndroidSigningStorePass=env:STORE_PASS -p:AndroidSigningKeyAlias="$KEY_ALIAS"
          -p:AndroidSigningKeyPass=env:KEY_PASS

      - name: Name and check the APK
        run: |
          mkdir out
          apk="out/FastbootStudio-Mobile-$RELEASE_VERSION.apk"
          cp src/FastbootStudio.Mobile/bin/Release/net8.0-android/*-Signed.apk "$apk"
          # Signed with the release key, not the test key.
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee out/certs.txt
          if grep -q "CN=Android Debug" out/certs.txt; then echo "::error::The APK is signed with the debug key."; exit 1; fi
          (cd out && sha256sum "$(basename "$apk")" > SHA256SUMS && cat SHA256SUMS)
          rm out/certs.txt "$RUNNER_TEMP/release.jks"
          echo "FILE=$apk" >> "$GITHUB_ENV"
          echo "TAG=$RELEASE_VERSION" >> "$GITHUB_ENV"
          [[ "$RELEASE_VERSION" == *-* ]] && echo "PRE=true" >> "$GITHUB_ENV" || echo "PRE=false" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum=$(cut -d' ' -f1 out/SHA256SUMS)
          {
            awk -v v="## $RELEASE_VERSION" '$0 == v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md
            echo
            echo "---"
            echo "**التحميل:** \`$(basename "$FILE")\`، ثبّته على الجوال (يحتاج أندرويد 8 أو أحدث). التفليش والنسخ الاحتياطي من الجوال يحتاج روت؛ الـ OTG (تفليش جوال ثاني بالكيبل) يشتغل بدونه."
            echo
            echo "**Download** \`$(basename "$FILE")\` and install it on the phone (Android 8 or newer). Flashing and backups on the phone need root; OTG (flashing another phone over a cable) works without it."
            echo
            echo "SHA-256: \`$sum\`"
            echo
            echo "[README](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_VERSION/README.md) · [العربية](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_VERSION/README.ar.md) · [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_VERSION/CHANGELOG.md)"
          } > notes.md
          cat notes.md
          flags=()
          [ "$PRE" = true ] && flags+=(--prerelease)
          gh release create "$RELEASE_VERSION" "$FILE" out/SHA256SUMS -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fastboot Studio Mobile $RELEASE_VERSION" --notes-file notes.md "${flags[@]}"

      - name: Notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TOPIC: ${{ secrets.TELEGRAM_TOPIC }}
          TOOL: FastbootStudioMobile
          ICON: "📱"
          LAYER: "تطبيق أندرويد للتفليش الآمن والنسخ الاحتياطي و OTG"
          REQUIRES: "Android 8+ (الروت للتفليش من الجوال)"
          AUTO_UPDATE: "false"
          VERSION: ${{ env.RELEASE_VERSION }}
        run: bash .github/scripts/telegram-release.sh
