name: ci

on:
  push:
  pull_request:

jobs:
  core:
    name: safety core and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/FastbootStudio.Mobile.Core.Tests -c Release
